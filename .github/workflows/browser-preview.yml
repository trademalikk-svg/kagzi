name: KAGZI browser preview regression
on:
  push:
    branches: [fix/public-free-access-preview-2026-11-08]
  pull_request:
    branches: [main]
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser-preview.spec.mjs
        env:
          KAGZI_PREVIEW_URL: https://fix-public-free-access-previ.kagzi-8cy.pages.dev
