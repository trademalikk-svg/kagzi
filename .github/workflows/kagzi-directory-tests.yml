name: KAGZI directory tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/jan-seva-directory-faq-expansion]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
