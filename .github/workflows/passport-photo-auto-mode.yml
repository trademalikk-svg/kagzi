name: Passport photo auto mode checks
on:
  push:
    branches: [feat/passport-photo-auto-mode]
  pull_request:
    branches: [main]
jobs:
  passport-photo-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/passport-photo-auto-mode.test.mjs
