name: KAGZI Daily Government Scheme Updates

on:
  schedule:
    # 09:15 India time (03:45 UTC)
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kagzi-government-scheme-updates
  cancel-in-progress: false

jobs:
  update-scheme-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test scheme update parser
        run: python -m unittest tests.test_scheme_updates
      - name: Collect official PIB scheme releases
        run: python scripts/update_scheme_updates.py
      - name: Commit updated scheme feed
        run: |
          if git diff --quiet -- government-schemes/data/updates.json; then
            echo "No new official scheme updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add government-schemes/data/updates.json
          git commit -m "chore: refresh official government scheme updates"
          git push
