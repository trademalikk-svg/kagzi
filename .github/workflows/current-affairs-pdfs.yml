name: Build Current Affairs PDFs
on:
  push:
    branches: [main]
    paths:
      - 'current-affairs-book.html'
      - 'scripts/build_current_affairs_pdfs.py'
      - '.github/workflows/current-affairs-pdfs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: current-affairs-pdf-build
  cancel-in-progress: false
jobs:
  build-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fonts and browser
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium
      - name: Generate free Daily and Weekly PDFs
        run: python scripts/build_current_affairs_pdfs.py
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-affairs/day/*.pdf current-affairs/weekly/*.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "Publish Current Affairs PDFs into their folders"
            git push origin main
          fi
