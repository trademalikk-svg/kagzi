          const innerTextPtr = module.FPDFFormObj_GetObject(middlePtr, 0);
          assert.equal(module.FPDFPageObj_GetType(innerTextPtr), 1, 'nested Form must contain a text object');
          const run = engine.readPage(0, 0).find(item => item.text.includes('Nested nested Form target'));
