name: PDFcanvas isolated dependency spike

on:
  push:
    branches:
      - experiment/pdfcanvas-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-smoke:
    name: Build and audit pinned PDFcanvas source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out KAGZI experiment branch
        uses: actions/checkout@v4

      - name: Check out pinned PDFcanvas source
        uses: actions/checkout@v4
        with:
          repository: Frenxys/pdfcanvas
          ref: f9c25060bb03317709e9471a74acd04423758c63
          path: vendor/pdfcanvas

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install PDFcanvas locked dependencies
        working-directory: vendor/pdfcanvas
        run: npm ci --no-audit --no-fund

      - name: Build PDFcanvas from pinned source
        working-directory: vendor/pdfcanvas
        run: npm run build

      - name: Verify source metadata and bundled PDFium WASM
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const pdfiumPath = path.dirname(require.resolve('@embedpdf/pdfium'));

          if (pkg.version !== '0.9.0') {
            throw new Error(`Unexpected pdfcanvas version: ${pkg.version}`);
          }
          if (pkg.license !== 'MIT') {
            throw new Error(`Unexpected pdfcanvas license metadata: ${pkg.license}`);
          }

          const wasmFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.wasm')) wasmFiles.push(full);
            }
          }
          walk(pdfiumPath);

          if (wasmFiles.length === 0) {
            throw new Error('No PDFium WASM binary found in installed @embedpdf/pdfium package.');
          }

          console.log(JSON.stringify({
            pinnedSourceCommit: 'f9c25060bb03317709e9471a74acd04423758c63',
            pdfcanvasVersion: pkg.version,
            pdfcanvasLicense: pkg.license,
            pdfiumDependency: pkg.dependencies?.['@embedpdf/pdfium'],
            wasmFiles
          }, null, 2));
          NODE

      - name: Run upstream original-text smoke check
        working-directory: vendor/pdfcanvas
        run: npm run check:text
