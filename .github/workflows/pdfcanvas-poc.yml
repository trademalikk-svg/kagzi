      - name: Gate Form XObject replacement (separate discovery from verified edit)
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const source = await PDFDocument.create();
          const sourceFont = await source.embedFont(StandardFonts.Helvetica);
          const sourcePage = source.addPage([612, 792]);
          sourcePage.drawText('Form XObject original text', { x: 60, y: 700, size: 16, font: sourceFont });
          const sourceBytes = await source.save();
          const loadedSource = await PDFDocument.load(sourceBytes);

          const targetDoc = await PDFDocument.create();
          const [formPage] = await targetDoc.embedPages([loadedSource.getPage(0)]);
          const page = targetDoc.addPage([612, 792]);
          page.drawPage(formPage, { x: 0, y: 0, width: 612, height: 792 });
          const sentinelFont = await targetDoc.embedFont(StandardFonts.Helvetica);
          page.drawText('Unrelated page sentinel', { x: 60, y: 640, size: 12, font: sentinelFont });
          page.drawText('Same-line control sentinel', { x: 440, y: 700, size: 12, font: sentinelFont });
          const input = new Uint8Array(await targetDoc.save({ useObjectStreams: true }));

          const engine = await PdfiumTextEngine.create(wasm, input);
          const runs = engine.readPage(0, 0);
          const target = runs.find(run => run.text.includes('Form XObject original text'));
          const sentinel = runs.find(run => run.text.includes('Unrelated page sentinel'));
          assert.ok(sentinel, 'ordinary page text must be discoverable');

          let gate = 'BLOCKED_NOT_DISCOVERED';
          let replacementAttempted = false;
          let replacementRoundTrip = false;
          let detail = 'Form XObject text was not returned by the reader.';
          if (target && target.editable !== true) {
            gate = 'BLOCKED_DISCOVERED_NOT_EDITABLE';
            detail = 'Form XObject text was discovered, but the engine does not mark it editable.';
          } else if (target?.editable === true) {
            replacementAttempted = true;
            const edited = engine.applyEdits([{
              ...target,
              newText: 'Form XObject replacement text',
              originalText: target.text,
              background: '#ffffff'
            }]);
            if (edited.failed.length === 0) {
              engine.destroy();
              const verify = await PdfiumTextEngine.create(wasm, edited.bytes);
              const after = verify.readPage(0, 0).map(run => run.text).join(' ');
              const replacementFound = after.includes('Form XObject replacement text');
              const originalRemoved = !after.includes('Form XObject original text');
              const unrelatedPreserved = after.includes('Unrelated page sentinel');
              const sameLineControlPreserved = after.includes('Same-line control sentinel');
              replacementRoundTrip = replacementFound && originalRemoved && unrelatedPreserved && sameLineControlPreserved;
              verify.destroy();
              if (replacementRoundTrip) {
                gate = 'TEXT_ROUND_TRIP_VERIFIED_VISUAL_CHECK_PENDING';
                detail = 'Replacement text, removal of original text, and both unrelated sentinels passed extraction checks; rendered visual comparison is still required.';
              } else {
                gate = 'BLOCKED_ROUND_TRIP_NOT_VERIFIED';
                detail = JSON.stringify({
                  replacementFound,
                  originalRemoved,
                  unrelatedPageSentinelPreserved: unrelatedPreserved,
                  sameLineControlPreserved,
                  extractedAfterEdit: after
                });
              }
            } else {
              gate = 'BLOCKED_APPLY_EDITS_FAILED';
              detail = JSON.stringify(edited.failed);
            }
          }
          if (!replacementAttempted || gate === 'BLOCKED_APPLY_EDITS_FAILED') engine.destroy();

          const report = {
            gate,
            discovered: Boolean(target),
            engineEditable: target?.editable === true,
            replacementAttempted,
            replacementRoundTrip,
            unrelatedPageTextPreserved: Boolean(sentinel),
            detail,
            releasePolicy: gate === 'TEXT_ROUND_TRIP_VERIFIED_VISUAL_CHECK_PENDING'
              ? 'Do not enable user-facing Form XObject editing until rendered visual comparison also passes.'
              : 'Keep Form XObject content non-editable.'
          };
          console.log(JSON.stringify(report, null, 2));
          const summary = [
            '### Form XObject replacement gate',
            '',
            '| Check | Result |',
            '|---|---|',
            '| Gate | **' + gate + '** |',
            '| Text discovered | ' + Boolean(target) + ' |',
            '| Engine marks editable | ' + (target?.editable === true) + ' |',
            '| Replacement attempted | ' + replacementAttempted + ' |',
            '| Text round-trip verified | ' + replacementRoundTrip + ' |',
            '| Unrelated page text | ' + (replacementRoundTrip ? 'preserved after edit' : (sentinel ? 'found before edit; preservation not tested' : 'not found')) + ' |',
            '',
            detail,
            '',
            report.releasePolicy,
            ''
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Install isolated Node canvas for PDF.js visual comparison
        working-directory: vendor/pdfcanvas
        run: npm install --no-save --no-package-lock --no-audit --no-fund @napi-rs/canvas@0.1.80

      - name: Compare Form XObject replacement render with PDF.js
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createCanvas, DOMMatrix, ImageData, Path2D } from '@napi-rs/canvas';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          // PDF.js uses browser canvas globals; @napi-rs/canvas supplies the Node equivalents.
          globalThis.DOMMatrix ??= DOMMatrix;
          globalThis.ImageData ??= ImageData;
          globalThis.Path2D ??= Path2D;
          const pdfjs = await import('pdfjs-dist/legacy/build/pdf.mjs');

          async function renderFirstPage(bytes) {
            const loading = pdfjs.getDocument({ data: bytes.slice(), useSystemFonts: true });
            const pdf = await loading.promise;
            try {
              const page = await pdf.getPage(1);
              const viewport = page.getViewport({ scale: 1 });
              const canvas = createCanvas(Math.ceil(viewport.width), Math.ceil(viewport.height));
              const context = canvas.getContext('2d');
              await page.render({ canvas, canvasContext: context, viewport }).promise;
              return {
                width: canvas.width,
                height: canvas.height,
                pixels: context.getImageData(0, 0, canvas.width, canvas.height).data
              };
            } finally {
              await loadingTask.destroy();
            }
          }

          const source = await PDFDocument.create();
          const sourceFont = await source.embedFont(StandardFonts.Helvetica);
          const sourcePage = source.addPage([612, 792]);
          sourcePage.drawText('Form XObject original text', { x: 60, y: 700, size: 16, font: sourceFont });
          const loadedSource = await PDFDocument.load(await source.save());

          const targetDoc = await PDFDocument.create();
          const [formPage] = await targetDoc.embedPages([loadedSource.getPage(0)]);
          const page = targetDoc.addPage([612, 792]);
          page.drawPage(formPage, { x: 0, y: 0, width: 612, height: 792 });
          const sentinelFont = await targetDoc.embedFont(StandardFonts.Helvetica);
          page.drawText('Unrelated page sentinel', { x: 60, y: 640, size: 12, font: sentinelFont });
          const input = new Uint8Array(await targetDoc.save({ useObjectStreams: true }));

          const engine = await PdfiumTextEngine.create('node_modules/@embedpdf/pdfium/dist/pdfium.wasm', input);
          const runs = engine.readPage(0, 0);
          const target = runs.find(run => run.text.includes('Form XObject original text'));
          assert.ok(runs.some(run => run.text.includes('Unrelated page sentinel')),
            'unrelated page sentinel must be discoverable');

          if (!target || target.editable !== true) {
            engine.destroy();
            console.log(JSON.stringify({
              result: 'BLOCKED',
              reason: !target ? 'Form XObject text was not discovered' : 'PDFium did not mark Form XObject text editable',
              visualReplacementComparison: 'not run because no replacement was safely available',
              policy: 'Keep Form XObject replacement disabled.'
            }, null, 2));
            const summary = [
              '### Form XObject visual comparison',
              '',
              '**BLOCKED** — no safely editable Form XObject run was available; no replacement was attempted.',
              '',
              'Visual replacement comparison remains pending. Keep this content non-editable.',
              ''
            ].join('\n');
            await import('node:fs').then(({ default: fs }) => fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary));
            process.exit(0);
          }

          const edited = engine.applyEdits([{
            ...target,
            newText: 'Form XObject replacement text',
            originalText: target.text,
            background: '#ffffff'
          }]);
          engine.destroy();
          const outputUnchanged = edited.bytes.length === input.length && edited.bytes.every((value, index) => value === input[index]);
          if (edited.failed.length > 0 || outputUnchanged) {
            console.log(JSON.stringify({
              result: 'BLOCKED',
              reason: 'PDFium applyEdits did not produce a replacement PDF',
              failed: edited.failed.map(run => run.text),
              policy: 'Keep Form XObject replacement disabled.'
            }, null, 2));
            process.exit(0);
          }

          const verify = await PdfiumTextEngine.create('node_modules/@embedpdf/pdfium/dist/pdfium.wasm', edited.bytes);
          const afterText = verify.readPage(0, 0).map(run => run.text).join(' ');
          verify.destroy();
          const replacementFound = afterText.includes('Form XObject replacement text');
          const originalRemoved = !afterText.includes('Form XObject original text');
          const sameLineControlPreserved = afterText.includes('Same-line control sentinel');
          const pageSentinelPreserved = afterText.includes('Unrelated page sentinel');
          if (!replacementFound || !originalRemoved || !sameLineControlPreserved || !pageSentinelPreserved) {
            const report = {
              result: 'BLOCKED',
              reason: 'PDFium applyEdits returned bytes, but text extraction round-trip did not prove a safe replacement',
              replacementFound,
              originalRemoved,
              sameLineControlPreserved,
              pageSentinelPreserved,
              extractedAfterEdit: afterText,
              policy: 'Do not enable Form XObject editing; visual comparison is skipped because semantic round-trip failed.'
            };
            console.log(JSON.stringify(report, null, 2));
            const summary = [
              '### Form XObject visual comparison',
              '',
              '**BLOCKED** — applyEdits returned output, but semantic text round-trip was not verified.',
              '',
              '| Check | Result |',
              '|---|---|',
              '| Replacement text found | ' + replacementFound + ' |',
              '| Original text removed | ' + originalRemoved + ' |',
              '| Same-line control preserved | ' + sameLineControlPreserved + ' |',
              '| Unrelated page sentinel preserved | ' + pageSentinelPreserved + ' |',
              '',
              'Rendered pixel comparison skipped. Keep Form XObject editing disabled.',
              ''
            ].join('\n');
            const fs = await import('node:fs');
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            process.exit(0);
          }

          const before = await renderFirstPage(input);
          const after = await renderFirstPage(edited.bytes);
          assert.equal(after.width, before.width, 'rendered page width must remain unchanged');
          assert.equal(after.height, before.height, 'rendered page height must remain unchanged');

          // Compare a full-width horizontal band around the target line. This allows
          // the replacement string to be wider while requiring every unrelated pixel
          // elsewhere on the page to remain identical under the same PDF.js renderer.
          const y0 = Math.max(0, Math.floor(target.y - 18));
          const y1 = Math.min(before.height, Math.ceil(target.y + target.h + 24));
          let changedInsideBand = 0;
          let changedOutsideBand = 0;
          let changedSameLineControl = 0;
          const controlX0 = 430;
          const controlX1 = 600;
          const controlY0 = Math.max(0, y0);
          const controlY1 = Math.min(before.height, y1);
          for (let y = 0; y < before.height; y += 1) {
            for (let x = 0; x < before.width; x += 1) {
              const offset = (y * before.width + x) * 4;
              const changed =
                before.pixels[offset] !== after.pixels[offset] ||
                before.pixels[offset + 1] !== after.pixels[offset + 1] ||
                before.pixels[offset + 2] !== after.pixels[offset + 2] ||
                before.pixels[offset + 3] !== after.pixels[offset + 3];
              if (changed) {
                if (y >= y0 && y < y1) changedInsideBand += 1;
                else changedOutsideBand += 1;
                if (x >= controlX0 && x < controlX1 && y >= controlY0 && y < controlY1) {
                  changedSameLineControl += 1;
                }
              }
            }
          }

          assert.ok(changedInsideBand > 0, 'replacement must produce a visible pixel change in the target text band');
          assert.equal(changedOutsideBand, 0,
            'pixels outside the target text band must remain identical (unrelated page content preserved)');
          assert.equal(changedSameLineControl, 0,
            'same-line control text and its surrounding pixels must remain identical');

          const report = {
            result: 'PASS',
            renderer: 'PDF.js (same renderer used by PDFcanvas)',
            canvasBackend: '@napi-rs/canvas',
            pagePixels: before.width + 'x' + before.height,
            targetBand: { y0, y1 },
            changedPixelsInsideTargetBand: changedInsideBand,
            changedPixelsOutsideTargetBand: changedOutsideBand,
            unrelatedPageVisuals: 'pixel-identical outside the edited text band',
            policy: 'Visual comparison passed for this fixture only; do not generalize Form XObject editability to other PDFs.'
          };
          console.log(JSON.stringify(report, null, 2));
          const summary = [
            '### Form XObject visual comparison',
            '',
            '| Check | Result |',
            '|---|---|',
            '| Renderer | PDF.js |',
            '| Page size | ' + before.width + ' × ' + before.height + ' px |',
            '| Changed pixels in target band | ' + changedInsideBand + ' |',
            '| Changed pixels outside target band | ' + changedOutsideBand + ' |',
            '| Unrelated page visuals | pixel-identical outside target band |',
            '| Same-line control pixels changed | ' + changedSameLineControl + ' |',
            '',
            'Visual comparison passed for this fixture only. This does not enable general Form XObject editing.'
          ].join('\n');
          const fs = await import('node:fs');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

