      - name: Verify fail-closed handling of encrypted and malformed PDFs
        working-directory: vendor/pdfcanvas
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const doc = await PDFDocument.create();
          const font = await doc.embedFont(StandardFonts.Helvetica);
          const page = doc.addPage([595.2756, 841.8898]);
          page.drawText('Confidential fixture text', { x: 50, y: 780, size: 14, font });
          const validBytes = new Uint8Array(await doc.save());
          fs.writeFileSync('valid-fixture.pdf', validBytes);
          execFileSync('qpdf', ['--encrypt', 'fixture-user', 'fixture-owner', '256', '--', 'valid-fixture.pdf', 'encrypted-fixture.pdf']);
          fs.writeFileSync('malformed-fixture.pdf', new TextEncoder().encode('%PDF-1.7\nthis is not a valid xref or page tree\n%%EOF'));

          async function inspectMustFailClosed(label, bytes) {
            let engine;
            try {
              engine = await PdfiumTextEngine.create(wasm, bytes);
              const runs = engine.readPage(0, 0);
              assert.equal(runs.length, 0, label + ': must not expose editable text without successful authorization/parse');
              console.log(label + ': blocked (no editable text exposed)');
            } catch (error) {
              console.log(label + ': blocked during open/parse (' + String(error?.message ?? error).slice(0, 180) + ')');
            } finally {
              engine?.destroy();
            }
          }

          await inspectMustFailClosed('encrypted PDF', new Uint8Array(fs.readFileSync('encrypted-fixture.pdf')));
          await inspectMustFailClosed('malformed PDF', new TextEncoder().encode('%PDF-1.7\nthis is not a valid xref or page tree\n%%EOF'));

          // Independent structural checker must report the malformed file as invalid.
          let qpdfRejected = false;
          try {
            execFileSync('qpdf', ['--check', 'malformed-fixture.pdf'], { stdio: 'pipe' });
          } catch (error) {
            qpdfRejected = true;
            console.log('qpdf structural check rejected malformed fixture: ' + String(error.stderr ?? error.stdout ?? '').slice(0, 300));
          }
          assert.equal(qpdfRejected, true, 'malformed fixture must fail independent qpdf structural validation');

          console.log(JSON.stringify({
            result: 'PASS',
            encryptedFixture: 'password-protected AES-256 PDF; PDFium rejects with password-required error',
            malformedFixture: 'invalid cross-reference/page-tree structure; PDFium rejects on open',
            independentStructuralValidation: 'qpdf rejected malformed fixture'
          }, null, 2));
          NODE
