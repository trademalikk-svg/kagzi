name: PDFcanvas isolated dependency spike

on:
  push:
    branches:
      - experiment/pdfcanvas-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-smoke:
    name: Build and audit pinned PDFcanvas source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out KAGZI experiment branch
        uses: actions/checkout@v4

      - name: Check out pinned PDFcanvas source
        uses: actions/checkout@v4
        with:
          repository: Frenxys/pdfcanvas
          ref: f9c25060bb03317709e9471a74acd04423758c63
          path: vendor/pdfcanvas

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PDFcanvas locked dependencies
        working-directory: vendor/pdfcanvas
        run: npm ci --no-audit --no-fund

      - name: Build PDFcanvas from pinned source
        working-directory: vendor/pdfcanvas
        run: npm run build

      - name: Verify source metadata and bundled PDFium WASM
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const pdfiumPath = path.dirname(require.resolve('@embedpdf/pdfium'));

          if (pkg.version !== '0.9.0') {
            throw new Error(`Unexpected pdfcanvas version: ${pkg.version}`);
          }
          if (pkg.license !== 'MIT') {
            throw new Error(`Unexpected pdfcanvas license metadata: ${pkg.license}`);
          }

          const wasmFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.wasm')) wasmFiles.push(full);
            }
          }
          walk(pdfiumPath);

          if (wasmFiles.length === 0) {
            throw new Error('No PDFium WASM binary found in installed @embedpdf/pdfium package.');
          }

          console.log(JSON.stringify({
            pinnedSourceCommit: 'f9c25060bb03317709e9471a74acd04423758c63',
            pdfcanvasVersion: pkg.version,
            pdfcanvasLicense: pkg.license,
            pdfiumDependency: pkg.dependencies?.['@embedpdf/pdfium'],
            wasmFiles
          }, null, 2));
          NODE

      - name: Inventory PDFium package license and bundled notice files
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const entry = require.resolve('@embedpdf/pdfium');
          let dir = path.dirname(entry);
          while (!fs.existsSync(path.join(dir, 'package.json'))) {
            const parent = path.dirname(dir);
            if (parent === dir) throw new Error('Cannot locate @embedpdf/pdfium package root');
            dir = parent;
          }
          const pkg = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'));
          const files = [];
          function walk(current, depth = 0) {
            if (depth > 3) return;
            for (const item of fs.readdirSync(current, { withFileTypes: true })) {
              const full = path.join(current, item.name);
              if (item.isDirectory()) walk(full, depth + 1);
              else if (/^(LICENSE|NOTICE|COPYING|THIRD_PARTY_NOTICES)(\\.|$)/i.test(item.name)) files.push(path.relative(dir, full));
            }
          }
          walk(dir);
          const wasm = [];
          function findWasm(current) {
            for (const item of fs.readdirSync(current, { withFileTypes: true })) {
              const full = path.join(current, item.name);
              if (item.isDirectory()) findWasm(full);
              else if (item.name.endsWith('.wasm')) wasm.push(path.relative(dir, full));
            }
          }
          findWasm(dir);
          console.log(JSON.stringify({
            package: '@embedpdf/pdfium',
            version: pkg.version,
            packageLicenseMetadata: pkg.license ?? null,
            licenseAndNoticeFiles: files,
            wasmFiles: wasm,
            reviewStatus: 'inventory only; verify every bundled PDFium third-party notice before redistribution'
          }, null, 2));
          if (wasm.length === 0) throw new Error('Expected bundled PDFium WASM was not found');
          NODE

      - name: Run upstream original-text smoke check
        working-directory: vendor/pdfcanvas
        run: npm run check:text


      - name: Run unsupported and image-only fixture classification
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts, rgb, degrees } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const doc = await PDFDocument.create();
          const font = await doc.embedFont(StandardFonts.Helvetica);
          const mixed = doc.addPage([595.2756, 841.8898]);
          mixed.drawText('Horizontal selectable text', { x: 50, y: 780, size: 14, font });
          mixed.drawText('Rotated text candidate', { x: 50, y: 720, size: 14, font, rotate: degrees(35) });

          const imageOnly = doc.addPage([595.2756, 841.8898]);
          const pixel = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/lS8AAAAASUVORK5CYII='), c => c.charCodeAt(0));
          const png = await doc.embedPng(pixel);
          imageOnly.drawImage(png, { x: 50, y: 700, width: 240, height: 120 });

          const bytes = new Uint8Array(await doc.save({ useObjectStreams: true }));
          const engine = await PdfiumTextEngine.create(wasm, bytes);
          const page0 = engine.readPage(0, 0);
          const page1 = engine.readPage(1, 0);
          const horizontalFound = page0.some(run => run.text.includes('Horizontal selectable text'));
          const rotatedFound = page0.some(run => run.text.includes('Rotated text candidate'));
          assert.ok(horizontalFound, 'horizontal text is discoverable');
          assert.equal(page1.length, 0, 'image-only page has no native text runs');
          engine.destroy();

          console.log(JSON.stringify({
            result: 'PASS',
            horizontalText: horizontalFound ? 'editable candidate discovered' : 'not found',
            rotatedText: rotatedFound ? 'returned by reader; requires separate rotation support test' : 'not returned by reader; classify unsupported',
            imageOnlyPage: page1.length === 0 ? 'ocr-required candidate' : 'unexpected text runs',
            pages: 2
          }, null, 2));
          NODE

      - name: Run isolated two-page A4 native replacement regression
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const sourceDoc = await PDFDocument.create();
          const font = await sourceDoc.embedFont(StandardFonts.Helvetica);
          const page1 = sourceDoc.addPage([595.2756, 841.8898]);
          page1.drawText('KAGZI PDF Editor Test', { x: 50, y: 780, size: 16, font });
          page1.drawText('Page one sentinel remains', { x: 50, y: 740, size: 11, font });
          const page2 = sourceDoc.addPage([595.2756, 841.8898]);
          page2.drawText('Second Test Page', { x: 50, y: 780, size: 16, font });
          page2.drawText('Page two must remain unchanged', { x: 50, y: 740, size: 11, font });
          const sourceBytes = new Uint8Array(await sourceDoc.save({ useObjectStreams: true }));

          const original = await PDFDocument.load(sourceBytes);
          assert.equal(original.getPageCount(), 2);
          const originalSize = original.getPage(0).getSize();

          const engine = await PdfiumTextEngine.create(wasm, sourceBytes);
          const pageOneRuns = engine.readPage(0, 0);
          const target = pageOneRuns.find(run => run.text.includes('KAGZI PDF Editor Test'));
          assert.ok(target, 'target text must be found as an editable text run');
          assert.equal(target.editable, true, 'target run must be editable');
          const result = engine.applyEdits([{
            ...target,
            newText: 'KAGZI Native Edit Test',
            originalText: target.text,
            background: '#ffffff'
          }]);
          assert.equal(result.failed.length, 0, 'native replacement must not fail');
          engine.destroy();
          assert.ok(result.bytes.length > 0);
          assert.equal(String.fromCharCode(...result.bytes.subarray(0, 5)), '%PDF-');

          const exported = await PDFDocument.load(result.bytes);
          assert.equal(exported.getPageCount(), 2, 'page count preserved');
          const exportedSize = exported.getPage(0).getSize();
          assert.ok(Math.abs(exportedSize.width - originalSize.width) < 0.1, 'page width preserved');
          assert.ok(Math.abs(exportedSize.height - originalSize.height) < 0.1, 'page height preserved');

          const verify = await PdfiumTextEngine.create(wasm, result.bytes);
          const afterPage1 = verify.readPage(0, 0).map(run => run.text).join(' ');
          const afterPage2 = verify.readPage(1, 0).map(run => run.text).join(' ');
          assert.ok(afterPage1.includes('KAGZI Native Edit Test'), 'replacement text must round-trip');
          assert.ok(!afterPage1.includes('KAGZI PDF Editor Test'), 'old text must be absent');
          assert.ok(afterPage1.includes('Page one sentinel remains'), 'unrelated text on edited page preserved');
          assert.ok(afterPage2.includes('Second Test Page'), 'second-page title preserved');
          assert.ok(afterPage2.includes('Page two must remain unchanged'), 'second-page body preserved');
          verify.destroy();

          console.log(JSON.stringify({
            result: 'PASS',
            fixture: 'synthetic two-page A4; Helvetica; selectable text; compressed object streams',
            replacement: 'KAGZI PDF Editor Test -> KAGZI Native Edit Test',
            pageCount: exported.getPageCount(),
            pageSize: exportedSize,
            unrelatedTextPreserved: true,
            secondPagePreserved: true,
            outputBytes: result.bytes.length
          }, null, 2));
          NODE


      - name: Test multiple operators, mixed styles, and Hindi font handling
        working-directory: vendor/pdfcanvas
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @pdf-lib/fontkit regenerator-runtime
          mkdir -p test-fonts
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf' -o test-fonts/NotoSansDevanagari.ttf
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosans/NotoSans%5Bwdth%2Cwght%5D.ttf' -o test-fonts/NotoSansLatin.ttf
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import 'regenerator-runtime/runtime.js';
          const { default: fontkit } = await import('@pdf-lib/fontkit');
          import { PDFDocument, StandardFonts, rgb } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';

          // Distinct text-showing operators on the same baseline.
          const operatorsDoc = await PDFDocument.create();
          const regular = await operatorsDoc.embedFont(StandardFonts.Helvetica);
          const bold = await operatorsDoc.embedFont(StandardFonts.HelveticaBold);
          const opPage = operatorsDoc.addPage([595.2756, 841.8898]);
          opPage.drawText('First operator', { x: 50, y: 780, size: 14, font: regular });
          opPage.drawText('Second operator', { x: 150, y: 780, size: 14, font: regular });
          opPage.drawText('Third operator', { x: 270, y: 780, size: 14, font: regular });
          opPage.drawText('Mixed ', { x: 50, y: 740, size: 14, font: regular });
          opPage.drawText('BOLD', { x: 91, y: 740, size: 14, font: bold });
          const opBytes = new Uint8Array(await operatorsDoc.save({ useObjectStreams: true }));
          const opEngine = await PdfiumTextEngine.create(wasm, opBytes);
          const runs = opEngine.readPage(0, 0);
          const allText = runs.map(r => r.text).join(' ');
          assert.ok(allText.includes('First operator'));
          assert.ok(allText.includes('Second operator'));
          assert.ok(allText.includes('Third operator'));
          const mixedRun = runs.find(r => r.text.includes('Mixed') || r.text.includes('BOLD'));
          assert.ok(mixedRun, 'mixed-style line content should be discoverable');
          const operatorRun = runs.find(r => r.text.includes('First operator'));
          assert.ok(operatorRun?.editable, 'same-style multi-operator line should be editable');
          const edited = opEngine.applyEdits([{
            ...operatorRun,
            newText: 'Replacement operator line',
            originalText: operatorRun.text,
            background: '#ffffff'
          }]);
          assert.equal(edited.failed.length, 0, 'multi-operator replacement should not fail');
          opEngine.destroy();
          const verifyEngine = await PdfiumTextEngine.create(wasm, edited.bytes);
          const verifyRuns = verifyEngine.readPage(0, 0);
          const verifyText = verifyRuns.map(r => r.text).join(' ');
          assert.ok(verifyText.includes('Replacement operator line'), 'multi-operator replacement should round-trip');
          assert.ok(!verifyText.includes('First operator'), 'old multi-operator text should be absent');
          const verifyMixed = verifyRuns.find(r => r.text.includes('Mixed') || r.text.includes('BOLD'));
          assert.ok(verifyMixed?.mixed === true && verifyMixed.editable === false, 'mixed-style run must remain non-editable');
          verifyEngine.destroy();

          console.log(JSON.stringify({
            fixture: 'multiple text operators and mixed regular/bold style',
            runCount: runs.length,
            textRuns: runs.map(r => ({ text: r.text, editable: r.editable, mixed: r.mixed, canStyle: r.canStyle })),
            mixedStyleReported: mixedRun.mixed === true,
            classification: mixedRun.mixed === true ? 'mixed-style correctly non-editable' : 'style boundary not represented as mixed; inspect run segmentation before editing',
            multiOperatorReplacement: 'round-trip passed; original text absent',
            mixedStyleReplacement: 'blocked by editable=false'
          }, null, 2));
          opEngine.destroy();

          // Hindi Devanagari using an openly licensed Noto Sans Devanagari font.
          const hindiDoc = await PDFDocument.create();
          hindiDoc.registerFontkit(fontkit);
          const hindiFont = await hindiDoc.embedFont(fs.readFileSync('test-fonts/NotoSansDevanagari.ttf'), { subset: true });
          const hindiPage = hindiDoc.addPage([595.2756, 841.8898]);
          hindiPage.drawText('हिंदी पाठ परीक्षण', { x: 50, y: 780, size: 18, font: hindiFont, color: rgb(0, 0, 0) });
          hindiPage.drawText('असंबंधित वाक्य सुरक्षित रहे', { x: 50, y: 740, size: 13, font: hindiFont });
          const hindiBytes = new Uint8Array(await hindiDoc.save({ useObjectStreams: true }));
          const hiEngine = await PdfiumTextEngine.create(wasm, hindiBytes);
          const hiRuns = hiEngine.readPage(0, 0);
          const hiText = hiRuns.map(r => r.text).join(' ');
          const foundHindi = hiText.includes('हिंदी पाठ परीक्षण');
          console.log(JSON.stringify({
            fixture: 'embedded subset Noto Sans Devanagari',
            discoveredRuns: hiRuns.length,
            extractedText: hiText,
            exactHindiRoundTripAvailable: foundHindi,
            classification: foundHindi ? 'Hindi text discovered; replacement test still required' : 'unsupported pending ToUnicode/CMap and glyph-mapping investigation'
          }, null, 2));
          hiEngine.destroy();

          // Compare a fully embedded font with the subset-font fixture above.
          const fullHindiDoc = await PDFDocument.create();
          fullHindiDoc.registerFontkit(fontkit);
          const fullHindiFont = await fullHindiDoc.embedFont(fs.readFileSync('test-fonts/NotoSansDevanagari.ttf'), { subset: false });
          const fullHindiPage = fullHindiDoc.addPage([595.2756, 841.8898]);
          fullHindiPage.drawText('हिंदी पाठ परीक्षण', { x: 50, y: 780, size: 18, font: fullHindiFont });
          const fullHindiBytes = new Uint8Array(await fullHindiDoc.save({ useObjectStreams: true }));
          const fullHiEngine = await PdfiumTextEngine.create(wasm, fullHindiBytes);
          const fullHiRuns = fullHiEngine.readPage(0, 0);
          const fullHiText = fullHiRuns.map(r => r.text).join(' ');
          const fullExact = fullHiText.includes('हिंदी पाठ परीक्षण');
          console.log(JSON.stringify({
            fixture: 'fully embedded Noto Sans Devanagari (subset=false)',
            discoveredRuns: fullHiRuns.length,
            extractedText: fullHiText,
            exactHindiRoundTripAvailable: fullExact,
            classification: fullExact ? 'candidate only; native replacement still requires round-trip test' : 'unsupported; full embedding did not resolve text mapping'
          }, null, 2));
          fullHiEngine.destroy();

          // Latin text with a fully embedded open font: verify extraction and replacement.
          fs.mkdirSync('test-fonts', { recursive: true });
          const latinFontBytes = fs.readFileSync('test-fonts/NotoSansLatin.ttf');
          const latinDoc = await PDFDocument.create();
          latinDoc.registerFontkit(fontkit);
          const latinFont = await latinDoc.embedFont(latinFontBytes, { subset: false });
          const latinPage = latinDoc.addPage([595.2756, 841.8898]);
          latinPage.drawText('KAGZI Latin Embedded Font Test', { x: 50, y: 780, size: 16, font: latinFont });
          latinPage.drawText('Unrelated Latin sentinel', { x: 50, y: 740, size: 12, font: latinFont });
          const latinBytes = new Uint8Array(await latinDoc.save({ useObjectStreams: true }));
          const latinEngine = await PdfiumTextEngine.create(wasm, latinBytes);
          const latinRuns = latinEngine.readPage(0, 0);
          const latinTarget = latinRuns.find(run => run.text.includes('KAGZI Latin Embedded Font Test'));
          const latinExact = Boolean(latinTarget);
          let latinReplacementRoundTrip = false;
          if (latinTarget?.editable) {
            const latinEdited = latinEngine.applyEdits([{
              ...latinTarget,
              newText: 'KAGZI Embedded Font Replacement',
              originalText: latinTarget.text,
              background: '#ffffff'
            }]);
            if (latinEdited.failed.length === 0) {
              const latinVerify = await PdfiumTextEngine.create(wasm, latinEdited.bytes);
              const latinAfter = latinVerify.readPage(0, 0).map(run => run.text).join(' ');
              latinReplacementRoundTrip =
                latinAfter.includes('KAGZI Embedded Font Replacement') &&
                !latinAfter.includes('KAGZI Latin Embedded Font Test') &&
                latinAfter.includes('Unrelated Latin sentinel');
              latinVerify.destroy();
            }
          }
          latinEngine.destroy();
          console.log(JSON.stringify({
            fixture: 'fully embedded Noto Sans Latin',
            extractedText: latinRuns.map(run => run.text),
            exactTextDiscovered: latinExact,
            replacementRoundTripPreservedSentinel: latinReplacementRoundTrip,
            classification: latinReplacementRoundTrip ? 'candidate; continue broader font/encoding tests' : 'unsupported for native replacement until round-trip passes'
          }, null, 2));
          if (!latinReplacementRoundTrip) throw new Error('Embedded Latin font replacement did not pass exact round-trip and sentinel preservation');
          NODE

      - name: Test Latin font sizes and standard style variants
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const cases = [
            { label: 'regular-10pt', fontName: StandardFonts.Helvetica, size: 10, source: 'Regular ten point source', replacement: 'Regular ten point revised' },
            { label: 'bold-16pt', fontName: StandardFonts.HelveticaBold, size: 16, source: 'Bold sixteen point source', replacement: 'Bold sixteen point revised' },
            { label: 'oblique-24pt', fontName: StandardFonts.HelveticaOblique, size: 24, source: 'Oblique twenty four point source', replacement: 'Oblique twenty four point revised' }
          ];

          const results = [];
          for (const fixture of cases) {
            const doc = await PDFDocument.create();
            const font = await doc.embedFont(fixture.fontName);
            const page = doc.addPage([595.2756, 841.8898]);
            page.drawText(fixture.source, { x: 50, y: 780, size: fixture.size, font });
            page.drawText('Unrelated style-matrix sentinel', { x: 50, y: 720, size: 11, font });
            const input = new Uint8Array(await doc.save({ useObjectStreams: true }));

            const engine = await PdfiumTextEngine.create(wasm, input);
            const target = engine.readPage(0, 0).find(run => run.text.includes(fixture.source));
            assert.ok(target, fixture.label + ': source text must be discoverable');
            assert.equal(target.editable, true, fixture.label + ': run must be marked editable');

            const output = engine.applyEdits([{
              ...target,
              newText: fixture.replacement,
              originalText: target.text,
              background: '#ffffff'
            }]);
            assert.equal(output.failed.length, 0, fixture.label + ': edit must not report failure');
            engine.destroy();

            const reopened = await PdfiumTextEngine.create(wasm, output.bytes);
            const actual = reopened.readPage(0, 0).map(run => run.text).join(' ');
            assert.ok(actual.includes(fixture.replacement), fixture.label + ': replacement must round-trip');
            assert.ok(!actual.includes(fixture.source), fixture.label + ': old text must be absent');
            assert.ok(actual.includes('Unrelated style-matrix sentinel'), fixture.label + ': unrelated text must remain');
            reopened.destroy();

            results.push({
              fixture: fixture.label,
              requestedPointSize: fixture.size,
              sourceFont: fixture.fontName,
              replacementRoundTrip: 'PASS',
              unrelatedTextPreserved: true
            });
          }

          console.log(JSON.stringify({
            result: 'PASS',
            scope: 'separate horizontal Latin text runs using PDF standard fonts',
            cases: results,
            note: 'This does not establish support for arbitrary embedded fonts, rotated text, mixed-style runs, or non-Latin encodings.'
          }, null, 2));
          NODE

      - name: Classify RTL Arabic and rotated text fixtures conservatively
        working-directory: vendor/pdfcanvas
        run: |
          mkdir -p test-fonts
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansarabic/NotoSansArabic%5Bwdth%2Cwght%5D.ttf' -o test-fonts/NotoSansArabic.ttf
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import fontkit from '@pdf-lib/fontkit';
          import { PDFDocument, StandardFonts, degrees } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const doc = await PDFDocument.create();
          doc.registerFontkit(fontkit);
          const arabicFont = await doc.embedFont(fs.readFileSync('test-fonts/NotoSansArabic.ttf'), { subset: false });
          const latin = await doc.embedFont(StandardFonts.Helvetica);
          const page = doc.addPage([595.2756, 841.8898]);
          const rtlSource = 'مرحبا بالعالم';
          page.drawText(rtlSource, { x: 50, y: 780, size: 18, font: arabicFont });
          page.drawText('Rotated page content candidate', { x: 50, y: 700, size: 14, font: latin, rotate: degrees(90) });
          const bytes = new Uint8Array(await doc.save({ useObjectStreams: true }));

          const engine = await PdfiumTextEngine.create(wasm, bytes);
          const runs = engine.readPage(0, 0);
          const extracted = runs.map(run => run.text).join(' ');
          const exactRtl = extracted.includes(rtlSource);
          const rtlRun = runs.find(run => /مرحبا|العالم/.test(run.text));
          const rotatedRun = runs.find(run => run.text.includes('Rotated page content candidate'));

          // This fixture is always conservatively blocked at the KAGZI policy layer.
          // PDFcanvas may mark a run editable even when its extracted Unicode is not exact.
          const policyClassification = exactRtl && rtlRun?.editable
            ? 'candidate only; replacement and visual bidi layout still require separate tests'
            : 'unsupported until exact Unicode mapping and safe editability are proven';

          console.log(JSON.stringify({
            result: 'PASS',
            rtlEngineRisk: !exactRtl && Boolean(rtlRun?.editable)
              ? 'ENGINE RISK: PDFcanvas marks incorrectly extracted RTL text editable'
              : 'no unsafe editable flag observed in this fixture',
            rtlRunBlockedFromReplacement: true,
            rtlFixture: {
              expectedLogicalText: rtlSource,
              extractedText: extracted,
              exactLogicalTextRoundTrip: exactRtl,
              engineEditableFlag: rtlRun?.editable ?? false,
              classification: policyClassification
            },
            rotatedFixture: {
              discovered: Boolean(rotatedRun),
              classification: 'unsupported unless a dedicated rotation-aware coordinate and round-trip test passes'
            },
            policy: 'No replacement is attempted for RTL or rotated text in this classification fixture.'
          }, null, 2));
          engine.destroy();
          NODE

      - name: Classify rotated-page coordinate handling
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts, degrees } from 'pdf-lib';
