                rotate: degrees(angle),
                font: await overlayDoc.embedFont(StandardFonts.Helvetica)
              });
              const output = new Uint8Array(await overlayDoc.save());
              const after = await render(output);
              const replacementFound = after.textItems.some(item => item.str.includes('Nested nested Form sample'));
              assert.ok(replacementFound, 'nested replacement must survive PDF.js reopen');

              const bounds = item => {
                const [a, b, c, d, e, f] = item.transform;
                const sx = Math.hypot(a, b) || 1;
                const sy = Math.hypot(c, d) || 1;
                const ux = a / sx, uy = b / sx, vx = c / sy, vy = d / sy;
