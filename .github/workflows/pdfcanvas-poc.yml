          const after = await render(output);
          assert.ok(after.text.includes('REPLACEMENT: Form text inside triangle'));

          const insideTriangle = (point) => {
            const [a, b, c] = polygon;
            const sign = (p1, p2, p3) =>
              (p1[0] - p3[0]) * (p2[1] - p3[1]) -
              (p2[0] - p3[0]) * (p1[1] - p3[1]);
            const d1 = sign(point, a, b);
            const d2 = sign(point, b, c);
            const d3 = sign(point, c, a);
            const hasNeg = d1 < 0 || d2 < 0 || d3 < 0;
            const hasPos = d1 > 0 || d2 > 0 || d3 > 0;
            return !(hasNeg && hasPos);
          };
          const orientation = (a, b, c) =>
            (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]);
          const segmentsIntersect = (a, b, c, d) => {
            const epsilon = 1e-9;
            const onSegment = (p, q, r) =>
              r[0] >= Math.min(p[0], q[0]) - epsilon &&
              r[0] <= Math.max(p[0], q[0]) + epsilon &&
              r[1] >= Math.min(p[1], q[1]) - epsilon &&
              r[1] <= Math.max(p[1], q[1]) + epsilon;
            const o1 = orientation(a, b, c);
            const o2 = orientation(a, b, d);
            const o3 = orientation(c, d, a);
            const o4 = orientation(c, d, b);
            if (Math.abs(o1) <= epsilon && onSegment(a, b, c)) return true;
            if (Math.abs(o2) <= epsilon && onSegment(a, b, d)) return true;
            if (Math.abs(o3) <= epsilon && onSegment(c, d, a)) return true;
            if (Math.abs(o4) <= epsilon && onSegment(c, d, b)) return true;
            return ((o1 < 0 && o2 > 0) || (o1 > 0 && o2 < 0)) &&
              ((o3 < 0 && o4 > 0) || (o3 > 0 && o4 < 0));
