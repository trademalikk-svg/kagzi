            'PDF.js viewport x must account for the 100-point CropBox left offset'
          );
          assert.ok(
            Math.abs(pdfjsGeometry.baselineTopLeft[1] - 50) < 0.5,
            'PDF.js viewport y must account for the 150-point CropBox bottom offset'
          );
          assert.ok(
            Math.abs(target.x - 50) < 1,
            'PDFium text-run x must be relative to the CropBox left edge'
          );
          const pdfiumVerticalDelta = lowerTarget.y - target.y;
          const pdfjsVerticalDelta =
            pdfjsGeometry.lowerBaselineTopLeft[1] - pdfjsGeometry.baselineTopLeft[1];
          assert.ok(
            Math.abs(pdfiumVerticalDelta - pdfjsVerticalDelta) < 1,
            'PDFium vertical run spacing must match PDF.js viewport baseline spacing'
          );

          const result = {
            result: 'DIAGNOSTIC',
            fixture: 'non-zero CropBox origin; 400x500 visible region on 612x792 MediaBox',
            mediaBox: page.getMediaBox(),
            cropBox: page.getCropBox(),
            pdfiumRun: {
              text: target.text, x: target.x, y: target.y,
              width: target.w, height: target.h, editable: target.editable
            },
            pdfjsGeometry,
            pdfiumToViewportXDelta: target.x - pdfjsGeometry.baselineTopLeft[0],
            outsideCropTextDiscovered: Boolean(outside),
            interpretation: 'PDFium and PDF.js horizontal origins are checked against the known CropBox offset. Vertical glyph-box mapping and overlay placement still require a separate visual regression before editing can be enabled.',
            policy: 'Discovery only; no replacement is attempted and CropBox editing remains disabled.'
          };
          console.log(JSON.stringify(result, null, 2));
          engine.destroy();
          NODE

      - name: Test CropBox overlay placement and full-MediaBox pixel preservation
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createCanvas, DOMMatrix, ImageData, Path2D } from '@napi-rs/canvas';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          globalThis.DOMMatrix ??= DOMMatrix;
          globalThis.ImageData ??= ImageData;
          globalThis.Path2D ??= Path2D;
          const pdfjs = await import('pdfjs-dist/legacy/build/pdf.mjs');
          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';

          const media = { width: 612, height: 792 };
          const crop = { left: 100, bottom: 150, width: 400, height: 500 };
          const cropTop = media.height - (crop.bottom + crop.height);
          const cropRight = crop.left + crop.width;
          const cropBottom = cropTop + crop.height;

          const fixture = await PDFDocument.create();
          const font = await fixture.embedFont(StandardFonts.Helvetica);
          const page = fixture.addPage([media.width, media.height]);
          page.drawText('CropBox original target', { x: 150, y: 600, size: 16, font });
          page.drawText('CropBox unchanged control', { x: 150, y: 400, size: 14, font });
          page.drawText('Outside CropBox preservation sentinel', { x: 40, y: 100, size: 12, font });
          page.setCropBox(crop.left, crop.bottom, crop.width, crop.height);
          const input = new Uint8Array(await fixture.save({ useObjectStreams: true }));

          const engine = await PdfiumTextEngine.create(wasm, input);
          const target = engine.readPage(0, 0).find(run => run.text.includes('CropBox original target'));
          assert.ok(target, 'CropBox target must be discoverable by PDFium');
          assert.equal(target.editable, true, 'CropBox target must be editable for this regression');
          const edited = engine.applyEdits([{
            ...target,
            newText: 'CropBox replacement result',
            originalText: target.text,
            background: '#ffffff'
          }]);
          assert.equal(edited.failed.length, 0, 'CropBox replacement must complete without edit errors');
          engine.destroy();

          async function expandCropForDiagnostic(bytes) {
            const doc = await PDFDocument.load(bytes);
            doc.getPage(0).setCropBox(0, 0, media.width, media.height);
            return new Uint8Array(await doc.save({ useObjectStreams: true }));
          }

          async function renderAndExtract(bytes) {
            const task = pdfjs.getDocument({ data: bytes.slice(), useSystemFonts: true });
            const pdf = await task.promise;
            try {
              const renderedPage = await pdf.getPage(1);
              const viewport = renderedPage.getViewport({ scale: 1 });
              assert.equal(Math.round(viewport.width), media.width, 'diagnostic viewport must expose full MediaBox width');
              assert.equal(Math.round(viewport.height), media.height, 'diagnostic viewport must expose full MediaBox height');
              const canvas = createCanvas(Math.ceil(viewport.width), Math.ceil(viewport.height));
              const context = canvas.getContext('2d');
              await renderedPage.render({ canvas, canvasContext: context, viewport }).promise;
              const content = await renderedPage.getTextContent();
              return {
                width: canvas.width,
                height: canvas.height,
                pixels: context.getImageData(0, 0, canvas.width, canvas.height).data,
                textItems: content.items.filter(item => typeof item.str === 'string' && item.transform?.length === 6)
              };
            } finally {
              await task.destroy();
            }
          }

          const before = await renderAndExtract(await expandCropForDiagnostic(input));
          const after = await renderAndExtract(await expandCropForDiagnostic(edited.bytes));
          assert.equal(before.width, after.width, 'original and edited render widths must match');
          assert.equal(before.height, after.height, 'original and edited render heights must match');

          const beforeText = before.textItems.map(item => item.str).join(' ');
          const afterText = after.textItems.map(item => item.str).join(' ');
          assert.ok(beforeText.includes('CropBox original target'), 'original target must exist before replacement');
          assert.ok(!afterText.includes('CropBox original target'), 'original target must be absent after replacement');
          assert.ok(afterText.includes('CropBox replacement result'), 'replacement must survive PDF.js text extraction');
          assert.ok(afterText.includes('CropBox unchanged control'), 'in-CropBox control text must remain present');
          assert.ok(afterText.includes('Outside CropBox preservation sentinel'), 'outside-CropBox sentinel must remain present');

          const replacementItem = after.textItems.find(item => item.str.includes('CropBox replacement result'));
          assert.ok(replacementItem, 'PDF.js must expose replacement text geometry');
          const replacementBaseline = [replacementItem.transform[4], replacementItem.transform[5]];
          assert.ok(Math.abs(replacementBaseline[0] - 150) <= 1, 'replacement baseline X must remain at the expected MediaBox position');
          assert.ok(Math.abs(replacementBaseline[1] - 600) <= 1, 'replacement baseline Y must remain at the expected MediaBox position');

          let changedInsideCrop = 0;
          let changedOutsideCrop = 0;
          let changedControlRegion = 0;
          let changedTargetRegion = 0;
          for (let y = 0; y < before.height; y++) {
            for (let x = 0; x < before.width; x++) {
              const offset = (y * before.width + x) * 4;
              const changed =
                before.pixels[offset] !== after.pixels[offset] ||
                before.pixels[offset + 1] !== after.pixels[offset + 1] ||
                before.pixels[offset + 2] !== after.pixels[offset + 2] ||
                before.pixels[offset + 3] !== after.pixels[offset + 3];
              if (!changed) continue;

              const insideCrop = x >= crop.left && x < cropRight && y >= cropTop && y < cropBottom;
              if (insideCrop) changedInsideCrop++;
              else changedOutsideCrop++;

              if (x >= 140 && x < 460 && y >= 375 && y < 410) changedControlRegion++;
              if (x >= 140 && x < 500 && y >= 170 && y < 215) changedTargetRegion++;
            }
          }

          assert.ok(changedInsideCrop > 0, 'replacement must produce visible pixel changes inside CropBox');
          assert.ok(changedTargetRegion > 0, 'replacement pixel changes must occur in the target region');
          assert.equal(changedControlRegion, 0, 'unrelated in-CropBox control pixels must remain unchanged');
          assert.equal(changedOutsideCrop, 0, 'zero changed pixels are allowed outside the original CropBox');

          console.log(JSON.stringify({
            result: 'PASS',
            fixture: { mediaBox: media, cropBox: crop },
            replacementBaseline: { x: replacementBaseline[0], y: replacementBaseline[1] },
            changedInsideCrop,
            changedTargetRegion,
            changedControlRegion,
            changedOutsideCrop,
            outsideCropPolicy: 'zero pixel differences after expanding both diagnostic copies to full MediaBox',
            editingPolicy: 'synthetic fixture only; general Form XObject editing remains disabled'
          }, null, 2));
          NODE

      - name: Verify fail-closed handling of encrypted and malformed PDFs
        working-directory: vendor/pdfcanvas
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const doc = await PDFDocument.create();
          const font = await doc.embedFont(StandardFonts.Helvetica);
          const page = doc.addPage([595.2756, 841.8898]);
          page.drawText('Confidential fixture text', { x: 50, y: 780, size: 14, font });
          const validBytes = new Uint8Array(await doc.save());
          fs.writeFileSync('valid-fixture.pdf', validBytes);
          execFileSync('qpdf', ['--encrypt', 'fixture-user', 'fixture-owner', '256', '--', 'valid-fixture.pdf', 'encrypted-fixture.pdf']);
          fs.writeFileSync('malformed-fixture.pdf', new TextEncoder().encode('%PDF-1.7\nthis is not a valid xref or page tree\n%%EOF'));

          async function inspectMustFailClosed(label, bytes) {
            let engine;
            try {
              engine = await PdfiumTextEngine.create(wasm, bytes);
              const runs = engine.readPage(0, 0);
              assert.equal(runs.length, 0, label + ': must not expose editable text without successful authorization/parse');
              console.log(label + ': blocked (no editable text exposed)');
            } catch (error) {
              console.log(label + ': blocked during open/parse (' + String(error?.message ?? error).slice(0, 180) + ')');
            } finally {
              engine?.destroy();
            }
          }

          await inspectMustFailClosed('encrypted PDF', new Uint8Array(fs.readFileSync('encrypted-fixture.pdf')));
          await inspectMustFailClosed('malformed PDF', new TextEncoder().encode('%PDF-1.7\nthis is not a valid xref or page tree\n%%EOF'));

          // Independent structural checker must report the malformed file as invalid.
          let qpdfRejected = false;
          try {
            execFileSync('qpdf', ['--check', 'malformed-fixture.pdf'], { stdio: 'pipe' });
          } catch (error) {
            qpdfRejected = true;
