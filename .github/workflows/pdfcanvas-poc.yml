name: PDFcanvas isolated dependency spike

on:
  push:
    branches:
      - experiment/pdfcanvas-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-smoke:
    name: Build and audit pinned PDFcanvas source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out KAGZI experiment branch
        uses: actions/checkout@v4

      - name: Check out pinned PDFcanvas source
        uses: actions/checkout@v4
        with:
          repository: Frenxys/pdfcanvas
          ref: f9c25060bb03317709e9471a74acd04423758c63
          path: vendor/pdfcanvas

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install PDFcanvas locked dependencies
        working-directory: vendor/pdfcanvas
        run: npm ci --no-audit --no-fund

      - name: Build PDFcanvas from pinned source
        working-directory: vendor/pdfcanvas
        run: npm run build

      - name: Verify source metadata and bundled PDFium WASM
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';

          const require = createRequire(import.meta.url);
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const pdfiumPath = path.dirname(require.resolve('@embedpdf/pdfium'));

          if (pkg.version !== '0.9.0') {
            throw new Error(`Unexpected pdfcanvas version: ${pkg.version}`);
          }
          if (pkg.license !== 'MIT') {
            throw new Error(`Unexpected pdfcanvas license metadata: ${pkg.license}`);
          }

          const wasmFiles = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.name.endsWith('.wasm')) wasmFiles.push(full);
            }
          }
          walk(pdfiumPath);

          if (wasmFiles.length === 0) {
            throw new Error('No PDFium WASM binary found in installed @embedpdf/pdfium package.');
          }

          console.log(JSON.stringify({
            pinnedSourceCommit: 'f9c25060bb03317709e9471a74acd04423758c63',
            pdfcanvasVersion: pkg.version,
            pdfcanvasLicense: pkg.license,
            pdfiumDependency: pkg.dependencies?.['@embedpdf/pdfium'],
            wasmFiles
          }, null, 2));
          NODE

      - name: Run upstream original-text smoke check
        working-directory: vendor/pdfcanvas
        run: npm run check:text


      - name: Run unsupported and image-only fixture classification
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts, rgb, degrees } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const doc = await PDFDocument.create();
          const font = await doc.embedFont(StandardFonts.Helvetica);
          const mixed = doc.addPage([595.2756, 841.8898]);
          mixed.drawText('Horizontal selectable text', { x: 50, y: 780, size: 14, font });
          mixed.drawText('Rotated text candidate', { x: 50, y: 720, size: 14, font, rotate: degrees(35) });

          const imageOnly = doc.addPage([595.2756, 841.8898]);
          const pixel = Uint8Array.from(atob('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/lS8AAAAASUVORK5CYII='), c => c.charCodeAt(0));
          const png = await doc.embedPng(pixel);
          imageOnly.drawImage(png, { x: 50, y: 700, width: 240, height: 120 });

          const bytes = new Uint8Array(await doc.save({ useObjectStreams: true }));
          const engine = await PdfiumTextEngine.create(wasm, bytes);
          const page0 = engine.readPage(0, 0);
          const page1 = engine.readPage(1, 0);
          const horizontalFound = page0.some(run => run.text.includes('Horizontal selectable text'));
          const rotatedFound = page0.some(run => run.text.includes('Rotated text candidate'));
          assert.ok(horizontalFound, 'horizontal text is discoverable');
          assert.equal(page1.length, 0, 'image-only page has no native text runs');
          engine.destroy();

          console.log(JSON.stringify({
            result: 'PASS',
            horizontalText: horizontalFound ? 'editable candidate discovered' : 'not found',
            rotatedText: rotatedFound ? 'returned by reader; requires separate rotation support test' : 'not returned by reader; classify unsupported',
            imageOnlyPage: page1.length === 0 ? 'ocr-required candidate' : 'unexpected text runs',
            pages: 2
          }, null, 2));
          NODE

      - name: Run isolated two-page A4 native replacement regression
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const sourceDoc = await PDFDocument.create();
          const font = await sourceDoc.embedFont(StandardFonts.Helvetica);
          const page1 = sourceDoc.addPage([595.2756, 841.8898]);
          page1.drawText('KAGZI PDF Editor Test', { x: 50, y: 780, size: 16, font });
          page1.drawText('Page one sentinel remains', { x: 50, y: 740, size: 11, font });
          const page2 = sourceDoc.addPage([595.2756, 841.8898]);
          page2.drawText('Second Test Page', { x: 50, y: 780, size: 16, font });
          page2.drawText('Page two must remain unchanged', { x: 50, y: 740, size: 11, font });
          const sourceBytes = new Uint8Array(await sourceDoc.save({ useObjectStreams: true }));

          const original = await PDFDocument.load(sourceBytes);
          assert.equal(original.getPageCount(), 2);
          const originalSize = original.getPage(0).getSize();

          const engine = await PdfiumTextEngine.create(wasm, sourceBytes);
          const pageOneRuns = engine.readPage(0, 0);
          const target = pageOneRuns.find(run => run.text.includes('KAGZI PDF Editor Test'));
          assert.ok(target, 'target text must be found as an editable text run');
          assert.equal(target.editable, true, 'target run must be editable');
          const result = engine.applyEdits([{
            ...target,
            newText: 'KAGZI Native Edit Test',
            originalText: target.text,
            background: '#ffffff'
          }]);
          assert.equal(result.failed.length, 0, 'native replacement must not fail');
          engine.destroy();
          assert.ok(result.bytes.length > 0);
          assert.equal(String.fromCharCode(...result.bytes.subarray(0, 5)), '%PDF-');

          const exported = await PDFDocument.load(result.bytes);
          assert.equal(exported.getPageCount(), 2, 'page count preserved');
          const exportedSize = exported.getPage(0).getSize();
          assert.ok(Math.abs(exportedSize.width - originalSize.width) < 0.1, 'page width preserved');
          assert.ok(Math.abs(exportedSize.height - originalSize.height) < 0.1, 'page height preserved');

          const verify = await PdfiumTextEngine.create(wasm, result.bytes);
          const afterPage1 = verify.readPage(0, 0).map(run => run.text).join(' ');
          const afterPage2 = verify.readPage(1, 0).map(run => run.text).join(' ');
          assert.ok(afterPage1.includes('KAGZI Native Edit Test'), 'replacement text must round-trip');
          assert.ok(!afterPage1.includes('KAGZI PDF Editor Test'), 'old text must be absent');
          assert.ok(afterPage1.includes('Page one sentinel remains'), 'unrelated text on edited page preserved');
          assert.ok(afterPage2.includes('Second Test Page'), 'second-page title preserved');
          assert.ok(afterPage2.includes('Page two must remain unchanged'), 'second-page body preserved');
          verify.destroy();

          console.log(JSON.stringify({
            result: 'PASS',
            fixture: 'synthetic two-page A4; Helvetica; selectable text; compressed object streams',
            replacement: 'KAGZI PDF Editor Test -> KAGZI Native Edit Test',
            pageCount: exported.getPageCount(),
            pageSize: exportedSize,
            unrelatedTextPreserved: true,
            secondPagePreserved: true,
            outputBytes: result.bytes.length
          }, null, 2));
          NODE


      - name: Test multiple operators, mixed styles, and Hindi font handling
        working-directory: vendor/pdfcanvas
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund @pdf-lib/fontkit regenerator-runtime
          mkdir -p test-fonts
          curl -fL --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf' -o test-fonts/NotoSansDevanagari.ttf
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import 'regenerator-runtime/runtime.js';
          const { default: fontkit } = await import('@pdf-lib/fontkit');
          import { PDFDocument, StandardFonts, rgb } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';

          // Distinct text-showing operators on the same baseline.
          const operatorsDoc = await PDFDocument.create();
          const regular = await operatorsDoc.embedFont(StandardFonts.Helvetica);
          const bold = await operatorsDoc.embedFont(StandardFonts.HelveticaBold);
          const opPage = operatorsDoc.addPage([595.2756, 841.8898]);
          opPage.drawText('First operator', { x: 50, y: 780, size: 14, font: regular });
          opPage.drawText('Second operator', { x: 150, y: 780, size: 14, font: regular });
          opPage.drawText('Third operator', { x: 270, y: 780, size: 14, font: regular });
          opPage.drawText('Mixed ', { x: 50, y: 740, size: 14, font: regular });
          opPage.drawText('BOLD', { x: 91, y: 740, size: 14, font: bold });
          const opBytes = new Uint8Array(await operatorsDoc.save({ useObjectStreams: true }));
          const opEngine = await PdfiumTextEngine.create(wasm, opBytes);
          const runs = opEngine.readPage(0, 0);
          const allText = runs.map(r => r.text).join(' ');
          assert.ok(allText.includes('First operator'));
          assert.ok(allText.includes('Second operator'));
          assert.ok(allText.includes('Third operator'));
          const mixedRun = runs.find(r => r.text.includes('Mixed') || r.text.includes('BOLD'));
          assert.ok(mixedRun, 'mixed-style line content should be discoverable');
          const operatorRun = runs.find(r => r.text.includes('First operator'));
          assert.ok(operatorRun?.editable, 'same-style multi-operator line should be editable');
          const edited = opEngine.applyEdits([{
            ...operatorRun,
            newText: 'Replacement operator line',
            originalText: operatorRun.text,
            background: '#ffffff'
          }]);
          assert.equal(edited.failed.length, 0, 'multi-operator replacement should not fail');
          opEngine.destroy();
          const verifyEngine = await PdfiumTextEngine.create(wasm, edited.bytes);
          const verifyRuns = verifyEngine.readPage(0, 0);
          const verifyText = verifyRuns.map(r => r.text).join(' ');
          assert.ok(verifyText.includes('Replacement operator line'), 'multi-operator replacement should round-trip');
          assert.ok(!verifyText.includes('First operator'), 'old multi-operator text should be absent');
          const verifyMixed = verifyRuns.find(r => r.text.includes('Mixed') || r.text.includes('BOLD'));
          assert.ok(verifyMixed?.mixed === true && verifyMixed.editable === false, 'mixed-style run must remain non-editable');
          verifyEngine.destroy();

          console.log(JSON.stringify({
            fixture: 'multiple text operators and mixed regular/bold style',
            runCount: runs.length,
            textRuns: runs.map(r => ({ text: r.text, editable: r.editable, mixed: r.mixed, canStyle: r.canStyle })),
            mixedStyleReported: mixedRun.mixed === true,
            classification: mixedRun.mixed === true ? 'mixed-style correctly non-editable' : 'style boundary not represented as mixed; inspect run segmentation before editing',
            multiOperatorReplacement: 'round-trip passed; original text absent',
            mixedStyleReplacement: 'blocked by editable=false'
          }, null, 2));
          opEngine.destroy();

          // Hindi Devanagari using an openly licensed Noto Sans Devanagari font.
          const hindiDoc = await PDFDocument.create();
          hindiDoc.registerFontkit(fontkit);
          const hindiFont = await hindiDoc.embedFont(fs.readFileSync('test-fonts/NotoSansDevanagari.ttf'), { subset: true });
          const hindiPage = hindiDoc.addPage([595.2756, 841.8898]);
          hindiPage.drawText('हिंदी पाठ परीक्षण', { x: 50, y: 780, size: 18, font: hindiFont, color: rgb(0, 0, 0) });
          hindiPage.drawText('असंबंधित वाक्य सुरक्षित रहे', { x: 50, y: 740, size: 13, font: hindiFont });
          const hindiBytes = new Uint8Array(await hindiDoc.save({ useObjectStreams: true }));
          const hiEngine = await PdfiumTextEngine.create(wasm, hindiBytes);
          const hiRuns = hiEngine.readPage(0, 0);
          const hiText = hiRuns.map(r => r.text).join(' ');
          const foundHindi = hiText.includes('हिंदी पाठ परीक्षण');
          console.log(JSON.stringify({
            fixture: 'embedded subset Noto Sans Devanagari',
            discoveredRuns: hiRuns.length,
            extractedText: hiText,
            exactHindiRoundTripAvailable: foundHindi,
            classification: foundHindi ? 'Hindi text discovered; replacement test still required' : 'unsupported pending ToUnicode/CMap and glyph-mapping investigation'
          }, null, 2));
          hiEngine.destroy();
          NODE

      - name: Verify fail-closed handling of encrypted and malformed PDFs
        working-directory: vendor/pdfcanvas
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const doc = await PDFDocument.create();
          const font = await doc.embedFont(StandardFonts.Helvetica);
          const page = doc.addPage([595.2756, 841.8898]);
          page.drawText('Confidential fixture text', { x: 50, y: 780, size: 14, font });
          const validBytes = new Uint8Array(await doc.save());
          fs.writeFileSync('valid-fixture.pdf', validBytes);
          execFileSync('qpdf', ['--encrypt', 'fixture-user', 'fixture-owner', '256', '--', 'valid-fixture.pdf', 'encrypted-fixture.pdf']);

          async function inspectMustFailClosed(label, bytes) {
            let engine;
            try {
              engine = await PdfiumTextEngine.create(wasm, bytes);
              const runs = engine.readPage(0, 0);
              assert.equal(runs.length, 0, label + ': must not expose editable text without successful authorization/parse');
              console.log(label + ': blocked (no editable text exposed)');
            } catch (error) {
              console.log(label + ': blocked during open/parse (' + String(error?.message ?? error).slice(0, 180) + ')');
            } finally {
              engine?.destroy();
            }
          }

          await inspectMustFailClosed('encrypted PDF', new Uint8Array(fs.readFileSync('encrypted-fixture.pdf')));
          await inspectMustFailClosed('malformed PDF', new TextEncoder().encode('%PDF-1.7\nthis is not a valid xref or page tree\n%%EOF'));

          // A malformed document must not be accepted as a valid editable PDF by pdf-lib either.
          let malformedReopened = false;
          try {
            await PDFDocument.load(new TextEncoder().encode('%PDF-1.7\nthis is not a valid xref or page tree\n%%EOF'));
            malformedReopened = true;
          } catch {}
          assert.equal(malformedReopened, false, 'malformed fixture must fail independent PDF reopen validation');

          console.log(JSON.stringify({
            result: 'PASS',
            encryptedFixture: 'password-protected AES-256 PDF; parser must not expose editable runs',
            malformedFixture: 'invalid cross-reference/page-tree structure; open/parse must fail closed',
            malformedReopenValidation: 'rejected'
          }, null, 2));
          NODE
