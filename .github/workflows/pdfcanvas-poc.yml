                const p2 = [e + item.height * vx, f + item.height * vy];
                const p3 = [p1[0] + item.height * vx, p1[1] + item.height * vy];
                return [p0, p1, p2, p3].map(([x, y]) => [x, 792 - y]);
              };
              const originalItem = before.textItems.find(item => item.str.includes('Nested nested Form target'));
              const replacementItem = after.textItems.find(item => item.str.includes('Nested nested Form sample'));
              const corners = [...bounds(originalItem), ...bounds(replacementItem)];
              const xs = corners.map(p => p[0]), ys = corners.map(p => p[1]);
              const x0 = Math.max(0, Math.floor(Math.min(...xs) - 12));
              const x1 = Math.min(before.width, Math.ceil(Math.max(...xs) + 12));
              const y0 = Math.max(0, Math.floor(Math.min(...ys) - 12));
              const y1 = Math.min(before.height, Math.ceil(Math.max(...ys) + 12));
              let changedInside = 0, changedOutside = 0, changedControl = 0;
              for (let y = 0; y < before.height; y += 1) {
                for (let x = 0; x < before.width; x += 1) {
                  const p = (y * before.width + x) * 4;
                  const changed = before.pixels[p] !== after.pixels[p] ||
                    before.pixels[p + 1] !== after.pixels[p + 1] ||
                    before.pixels[p + 2] !== after.pixels[p + 2] ||
                    before.pixels[p + 3] !== after.pixels[p + 3];
                  if (!changed) continue;
                  if (x >= x0 && x < x1 && y >= y0 && y < y1) changedInside += 1;
                  else changedOutside += 1;
                  if (x >= 420 && x < 610 && y >= y0 && y < y1) changedControl += 1;
                }
              }
              const visuallyPreserved = changedInside > 0 && changedOutside === 0 && changedControl === 0;
              console.log(JSON.stringify({
                result: visuallyPreserved ? 'NESTED_FIXTURE_PASS' : 'NESTED_EDIT_UNSUPPORTED',
                outerMatrix,
                middleMatrix,
                textMatrix,
                combinedMatrix: combined,
                overlay: { x: combined[4], y: combined[5], size: run.textFontSize * scale, angle },
                replacementFound,
                originalRemoved: true,
                changedPixelsInsideTargetBounds: changedInside,
                changedPixelsOutsideTargetBounds: changedOutside,
                sameLineControlPixelsChanged: changedControl,
                interpretation: visuallyPreserved
                  ? 'Nested-nested replacement passed this synthetic fixture only; broader resource and clipping cases remain gated.'
                  : 'Nested-nested replacement failed visual preservation; keep nested-nested editing disabled.'
              }, null, 2));
            }
          }
          NODE

      - name: Verify nested Form parent and page resource inheritance
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts, PDFName } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const resourceKey = PDFName.of('Resources');
          const fontKey = PDFName.of('Font');
          const source = await PDFDocument.create();
          const font = await source.embedFont(StandardFonts.Helvetica);
          const sourcePage = source.addPage([612, 792]);
          sourcePage.drawText('Inherited nested Form font sentinel', { x: 60, y: 700, size: 16, font });

          function removeLocalResourcesAndHoistFonts(hostDoc, embeddedPage, hostPage) {
            const formStream = hostDoc.context.lookup(embeddedPage.ref);
            const localResources = formStream.dict.lookup(resourceKey);
            const localFonts = localResources.lookup(fontKey);
            hostPage.node.Resources().set(fontKey, localFonts);
            assert.equal(formStream.dict.delete(resourceKey), true, 'fixture must remove Form-local Resources');
          }

          async function discover(label, bytes) {
            const engine = await PdfiumTextEngine.create(wasm, bytes);
            try {
              const runs = engine.readPage(0, 0).map(run => run.text);
              const found = runs.some(text => text.includes('Inherited nested Form font sentinel'));
              assert.ok(found, label + ': PDFium must resolve the inherited font resource and discover the text');
              return { label, inheritedFontDiscovered: found, extractedText: runs.join(' | ') };
            } finally {
              engine.destroy();
            }
          }

          // Case 1: Form-local Resources are absent; font resource is supplied by the host page.
          const pageHostDoc = await PDFDocument.create();
          const [pageForm] = await pageHostDoc.embedPages([sourcePage]);
          const pageHost = pageHostDoc.addPage([612, 792]);
          pageHost.drawPage(pageForm, { x: 0, y: 0, width: 612, height: 792 });
          await pageForm.embed();
          removeLocalResourcesAndHoistFonts(pageHostDoc, pageForm, pageHost);
          const pageFallbackBytes = new Uint8Array(await pageHostDoc.save({ useObjectStreams: true }));
          const pageFallback = await discover('page-resource fallback', pageFallbackBytes);

          // Case 2: The deepest Form has no local Resources; its parent Form supplies the font.
          const parentHostDoc = await PDFDocument.create();
          const [childForm] = await parentHostDoc.embedPages([sourcePage]);
          const parentHostPage = parentHostDoc.addPage([612, 792]);
          parentHostPage.drawPage(childForm, { x: 0, y: 0, width: 612, height: 792 });
          await childForm.embed();
          removeLocalResourcesAndHoistFonts(parentHostDoc, childForm, parentHostPage);
          const parentReloaded = await PDFDocument.load(await parentHostDoc.save());
          const outerDoc = await PDFDocument.create();
          const [parentForm] = await outerDoc.embedPages([parentReloaded.getPage(0)]);
          const outerPage = outerDoc.addPage([612, 792]);
          outerPage.drawPage(parentForm, { x: 0, y: 0, width: 612, height: 792 });
          const outerFont = await outerDoc.embedFont(StandardFonts.Helvetica);
          outerPage.drawText('Inherited-resource page control', { x: 430, y: 700, size: 12, font: outerFont });
          const parentFallbackBytes = new Uint8Array(await outerDoc.save({ useObjectStreams: true }));
          const parentFallback = await discover('parent-Form-resource fallback', parentFallbackBytes);

          // Exercise deletion and serialization while the deepest Form inherits its font
          // dictionary from the parent Form rather than carrying local /Resources.
          const mutationEngine = await PdfiumTextEngine.create(wasm, parentFallbackBytes);
          const module = mutationEngine.m;
          const pagePtr = module.FPDF_LoadPage(mutationEngine.docPtr, 0);
          const outerIndex = Array.from(
            { length: module.FPDFPage_CountObjects(pagePtr) },
            (_, index) => index
          ).find(index => module.FPDFPageObj_GetType(module.FPDFPage_GetObject(pagePtr, index)) === 5);
          assert.notEqual(outerIndex, undefined, 'parent-resource fixture must contain an outer Form');
          const outerPtr = module.FPDFPage_GetObject(pagePtr, outerIndex);
          const childFormPtr = module.FPDFFormObj_GetObject(outerPtr, 0);
          assert.equal(module.FPDFPageObj_GetType(childFormPtr), 5, 'outer Form must contain the child Form');
          const childTextPtr = module.FPDFFormObj_GetObject(childFormPtr, 0);
          assert.equal(module.FPDFPageObj_GetType(childTextPtr), 1, 'child Form must contain its inherited-resource text object');

          const markDirty = objectPtr => {
            const wasActive = Boolean(module.FPDFPageObj_GetIsActive(objectPtr));
            if (!module.FPDFPageObj_SetIsActive(objectPtr, !wasActive)) return false;
            return Boolean(module.FPDFPageObj_SetIsActive(objectPtr, wasActive));
          };
          const removed = Boolean(module.FPDFFormObj_RemoveObject(childFormPtr, childTextPtr));
          if (removed) module.FPDFPageObj_Destroy(childTextPtr);
          const childMarkedDirty = removed && markDirty(childFormPtr);
          const outerMarkedDirty = childMarkedDirty && markDirty(outerPtr);
          const generated = outerMarkedDirty && Boolean(module.FPDFPage_GenerateContent(pagePtr));
          const mutationBytes = mutationEngine.save();
          module.FPDF_ClosePage(pagePtr);
          mutationEngine.destroy();
          assert.ok(removed && generated, 'nested inherited-resource child removal and ancestor serialization must complete');

          const verifyEngine = await PdfiumTextEngine.create(wasm, mutationBytes);
          const reopenedText = verifyEngine.readPage(0, 0).map(run => run.text).join(' | ');
          verifyEngine.destroy();
          assert.ok(!reopenedText.includes('Inherited nested Form font sentinel'), 'removed nested text must stay absent after Save/Reopen');
          assert.ok(reopenedText.includes('Inherited-resource page control'), 'unrelated page-level control must survive Save/Reopen');

          console.log(JSON.stringify({
            result: 'INHERITED_FORM_RESOURCE_FIXTURES_PASS',
            sourceRuntime: 'PDFium pinned by this workflow',
            cases: [pageFallback, parentFallback],
            nestedInheritedResourceDeletion: 'PASS',
            originalNestedTextRemovedAfterReopen: true,
            unrelatedPageControlPreserved: true,
            interpretation: 'PDFium discovered inherited resources from the page and parent Form. Nested child deletion also survived Save/Reopen while the child Form inherited its font dictionary from its parent. This is a synthetic fixture result, not general Form editing support.'
          }, null, 2));
          NODE

      - name: Verify local Form font resources shadow conflicting page aliases
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts, PDFName } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';
          import * as pdfjs from 'pdfjs-dist/legacy/build/pdf.mjs';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
          const fontKey = PDFName.of('Font');
          const sentinel = 'Local Form font must win over page alias';

          async function makeFixture(withCollision) {
            const source = await PDFDocument.create();
            const localFont = await source.embedFont(StandardFonts.Helvetica);
            const sourcePage = source.addPage([612, 792]);
            sourcePage.drawText(sentinel, { x: 60, y: 700, size: 18, font: localFont });

            const host = await PDFDocument.create();
            const [form] = await host.embedPages([sourcePage]);
            const page = host.addPage([612, 792]);
            page.drawPage(form, { x: 0, y: 0, width: 612, height: 792 });
            await form.embed();

            if (withCollision) {
              const formStream = host.context.lookup(form.ref);
              const formResources = formStream.dict.lookup(PDFName.of('Resources'));
              const formFonts = formResources.lookup(fontKey);
              const aliases = formFonts.keys();
              assert.ok(aliases.length > 0, 'Form must declare at least one local font alias');
              const collidingAlias = aliases[0];

              const courier = await host.embedFont(StandardFonts.Courier);
              page.drawText('page resource control', { x: 60, y: 650, size: 10, font: courier });
              const pageFonts = page.node.Resources().lookup(fontKey);
              assert.ok(pageFonts, 'control text must create page-level font resources');
              pageFonts.set(collidingAlias, courier.ref);
            }
            return new Uint8Array(await host.save({ useObjectStreams: true }));
          }

          async function measure(bytes) {
            const loadingTask = pdfjs.getDocument({ data: bytes, useSystemFonts: true });
            const pdf = await loadingTask.promise;
            try {
              const page = await pdf.getPage(1);
              const content = await page.getTextContent();
              const item = content.items.find(item => typeof item.str === 'string' && item.str.includes(sentinel));
              assert.ok(item, 'PDF.js must discover the Form text sentinel');
              const engine = await PdfiumTextEngine.create(wasm, bytes);
              try {
                const pdfiumText = engine.readPage(0, 0).map(run => run.text).join(' | ');
                assert.ok(pdfiumText.includes(sentinel), 'PDFium must discover the Form text sentinel with colliding page alias');
              } finally {
                engine.destroy();
              }
              return { width: item.width, height: item.height };
            } finally {
              await loadingTask.destroy();
            }
          }

          const baseline = await makeFixture(false);
          const collision = await makeFixture(true);
          const baselineMetrics = await measure(baseline);
          const collisionMetrics = await measure(collision);
          assert.ok(Math.abs(baselineMetrics.width - collisionMetrics.width) < 0.01,
            'Form-local Helvetica alias must shadow the conflicting page-level Courier alias');

          console.log(JSON.stringify({
            result: 'FORM_LOCAL_RESOURCE_SHADOWING_PASS',
            baselineMetrics,
            collisionMetrics,
            localAliasShadowedParentAlias: true,
            interpretation: 'The same font resource name mapped to Courier at page scope did not override the Form-local Helvetica mapping. This verifies only local-over-page font alias precedence for this generated fixture.'
          }, null, 2));
          NODE

      - name: Compare CropBox coordinates with PDF.js viewport geometry
        working-directory: vendor/pdfcanvas
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PDFDocument, StandardFonts } from 'pdf-lib';
          import { PdfiumTextEngine } from './dist/index.js';

          const wasm = 'node_modules/@embedpdf/pdfium/dist/pdfium.wasm';
