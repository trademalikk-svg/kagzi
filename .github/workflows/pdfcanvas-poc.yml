            matrixApiAvailable: hasMatrixApi,
            cases: reports,
            interpretation: 'Use these observed page/Form/text matrices to define transform-aware replacement coordinates. No transformed Form XObject edits are enabled by this diagnostic.',
            policy: 'Synthetic fixtures only; no production documents are changed.'
