          const pdf = await task.promise;
          let pdfjsGeometry;
          try {
            const browserPage = await pdf.getPage(1);
            const viewport = browserPage.getViewport({ scale: 1 });
            const content = await browserPage.getTextContent();
            const item = content.items.find(entry =>
              typeof entry.str === 'string' && entry.str.includes('CropBox coordinate sentinel')
            );
            const lowerItem = content.items.find(entry =>
              typeof entry.str === 'string' && entry.str.includes('CropBox lower vertical sentinel')
            );
            assert.ok(item, 'PDF.js must expose the CropBox target text');
            assert.ok(lowerItem, 'PDF.js must expose the lower vertical sentinel');
            pdfjsGeometry = {
              viewport: { width: viewport.width, height: viewport.height, viewBox: viewport.viewBox },
              text: item.str,
              transform: item.transform,
              width: item.width,
              height: item.height,
              baselineTopLeft: viewport.convertToViewportPoint(
                item.transform[4], item.transform[5]
              ),
              lowerText: lowerItem.str,
              lowerBaselineTopLeft: viewport.convertToViewportPoint(
                lowerItem.transform[4], lowerItem.transform[5]
              )
            };
          } finally {
            await task.destroy();
          }

          assert.ok(
