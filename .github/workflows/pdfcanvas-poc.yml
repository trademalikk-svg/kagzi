              [left, bottom], [right, bottom], [right, top], [left, top]
            ];
            if (corners.some(insideTriangle)) return true;
            if (polygon.some(([x, y]) => x >= left && x <= right && y >= bottom && y <= top)) return true;
            const rectangleEdges = [
              [corners[0], corners[1]], [corners[1], corners[2]],
              [corners[2], corners[3]], [corners[3], corners[0]]
            ];
            const triangleEdges = [
              [polygon[0], polygon[1]], [polygon[1], polygon[2]],
              [polygon[2], polygon[0]]
            ];
            return triangleEdges.some(([a, b]) =>
              rectangleEdges.some(([c, d]) => segmentsIntersect(a, b, c, d))
            );
          };

          let changedInsideClip = 0;
          let changedOutsideClip = 0;
          let changedControl = 0;
          for (let y = 0; y < before.height; y += 1) {
