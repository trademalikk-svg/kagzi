              const p = (y * before.width + x) * 4;
              const changed = before.pixels[p] !== after.pixels[p] ||
                before.pixels[p + 1] !== after.pixels[p + 1] ||
                before.pixels[p + 2] !== after.pixels[p + 2] ||
                before.pixels[p + 3] !== after.pixels[p + 3];
              if (!changed) continue;
              if (pixelIntersectsTriangle(x, y)) changedInsideClip += 1;
              else changedOutsideClip += 1;
              if (x >= 420 && x < 610 && y >= 62 && y < 112) changedControl += 1;
            }
          }

          const report = {
            result: changedInsideClip > 0 && changedOutsideClip === 0 && changedControl === 0
              ? 'TRIANGULAR_CLIP_FIXTURE_PASS'
              : 'NONRECTANGULAR_CLIP_UNSUPPORTED',
            fixture: 'identity Form; triangular non-rectangular page-space clip reproduced around overlay',
            changedPixelsInsideClip: changedInsideClip,
            changedPixelsOutsideClip: changedOutsideClip,
            unrelatedControlPixelsChanged: changedControl,
            interpretation: 'A passing result proves only this exact triangular clip fixture; arbitrary Bezier, transformed, intersecting, or nested clipping paths remain unverified.'
          };
          console.log(JSON.stringify(report, null, 2));
          assert.ok(changedInsideClip > 0, 'replacement must change pixels inside the clip');
          // Preserve the observed edge-pixel leak as a BLOCKED diagnostic instead of
          // aborting the workflow; this must never be interpreted as a passing clip test.
          if (changedOutsideClip > 0) {
            console.log(`BLOCKED: ${changedOutsideClip} changed raster pixels fall outside the geometric triangle; keep non-rectangular Form editing disabled.`);
          }
          assert.equal(changedControl, 0, 'unrelated page control must remain unchanged');
