          const module = engine.m;
          const pagePtr = module.FPDF_LoadPage(engine.docPtr, 0);
          const pageObjectCount = module.FPDFPage_CountObjects(pagePtr);
          const outerIndex = Array.from({ length: pageObjectCount }, (_, index) => index)
            .find(index => module.FPDFPageObj_GetType(module.FPDFPage_GetObject(pagePtr, index)) === 5);
