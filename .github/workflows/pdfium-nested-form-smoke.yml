name: PDFium nested Form dirty API smoke

on:
  push:
    branches:
      - experiment/pdfcanvas-poc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nested-form-runtime-prototype:
    name: Compile and test nested Form dirty-stream API prototype
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EMSDK_VERSION: 3.1.72
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
    steps:
      - name: Check out KAGZI experiment branch
        uses: actions/checkout@v4

      - name: Check out exact EmbedPDF PDFium runtime source
        uses: actions/checkout@v4
        with:
          repository: embedpdf/runtime
          ref: 42388d3b4c9895d6672f5da357b1429678a0994c
          path: vendor/embedpdf-runtime

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Install Emscripten
        env:
          DEPOT_TOOLS_PYTHON_BYPASS: '1'
        run: |
          mkdir -p vendor/embedpdf-runtime/third_party
          git clone https://github.com/emscripten-core/emsdk.git vendor/embedpdf-runtime/third_party/emsdk
          vendor/embedpdf-runtime/third_party/emsdk/emsdk install "$EMSDK_VERSION"
          vendor/embedpdf-runtime/third_party/emsdk/emsdk activate "$EMSDK_VERSION"
          echo "$GITHUB_WORKSPACE/vendor/embedpdf-runtime/third_party/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/vendor/embedpdf-runtime/third_party/emsdk/upstream/bin" >> "$GITHUB_PATH"

      - name: Sync pinned PDFium dependencies
        working-directory: vendor/embedpdf-runtime
        env:
          PDF_RUNTIME_SYNC: auto
          PDF_RUNTIME_TARGET_OS_LIST: emscripten
        run: scripts/embedpdf-runtime/ensure-deps.sh

      - name: Apply nested Form dirty-stream API prototype
        run: |
          git -C vendor/embedpdf-runtime apply --check "$GITHUB_WORKSPACE/patches/pdfium/nested-form-dirty-stream-api.patch"
          git -C vendor/embedpdf-runtime apply "$GITHUB_WORKSPACE/patches/pdfium/nested-form-dirty-stream-api.patch"

      - name: Build patched PDFium WASM static library
        working-directory: vendor/embedpdf-runtime
        run: scripts/embedpdf-runtime/build-target.sh wasm32

      - name: Verify prototype symbol in compiled runtime
        working-directory: vendor/embedpdf-runtime
        run: |
          library="out/embedpdf-runtime/wasm32/obj/libembedpdf.a"
          test -s "$library"
          nm_tool="$(find third_party/emsdk/upstream/bin -type f -name llvm-nm -print -quit)"
          test -n "$nm_tool"
          "$nm_tool" --defined-only "$library" | grep -F "FPDFFormObj_MarkObjectDirty"

      - name: Link and run nested Form dirty API WASM smoke test
        working-directory: vendor/embedpdf-runtime
        run: |
          em++ "$GITHUB_WORKSPACE/tests/pdfium/nested-form-dirty-api-wasm-smoke.c" \
            -I"$GITHUB_WORKSPACE/vendor/embedpdf-runtime" \
            out/embedpdf-runtime/wasm32/obj/libembedpdf.a \
            -o "$RUNNER_TEMP/nested-form-dirty-api-smoke.js" \
            -sMODULARIZE=1 \
            -sEXPORTED_FUNCTIONS='["_main","_FPDFFormObj_MarkObjectDirty"]' \
            -sEXPORTED_RUNTIME_METHODS='["ccall"]'
          node -e 'const createModule = require(process.argv[1]); createModule().then(m => { const result = m.ccall("main", "number", [], []); if (result !== 0) { console.error("Nested Form Save/Reopen test failed with code " + result); process.exit(1); } console.log("WASM API linked; nested replacement survived Save/Reopen; original text removed; page control preserved"); }).catch(error => { console.error(error); process.exit(1); });' \
            "$RUNNER_TEMP/nested-form-dirty-api-smoke.js"
