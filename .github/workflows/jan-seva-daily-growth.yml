name: KAGZI Jan Seva Daily SEO and Competitor Research
on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"
permissions:
  contents: write
concurrency:
  group: jan-seva-daily-growth
  cancel-in-progress: false
jobs:
  daily-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run technical SEO and competitor checks
        run: node scripts/jan-seva-growth.mjs
      - name: Commit daily report and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "reports: daily Jan Seva SEO and competitor research"
            git push
          fi
