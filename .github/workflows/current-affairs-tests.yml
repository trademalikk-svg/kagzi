name: KAGZI Current Affairs Tests

on:
  pull_request:
    paths:
      - "current-affairs/**"
      - "scripts/update_current_affairs.py"
      - "tests/**"
      - ".github/workflows/current-affairs-*.yml"
      - "package.json"
  push:
    branches: [main]
    paths:
      - "current-affairs/**"
      - "scripts/update_current_affairs.py"
      - "tests/**"
      - ".github/workflows/current-affairs-*.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Node tests
        run: npm test
      - name: Run Python parser tests
        run: python -m unittest discover -s tests -p 'test_*.py'
