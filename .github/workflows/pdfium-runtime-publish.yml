name: Publish verified PDFium browser runtime

on:
  workflow_run:
    workflows: ["KAGZI PDFium native text runtime"]
    types: [completed]
    branches:
      - feature/kagzi-pdfium-native-text
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: "Successful KAGZI PDFium native text runtime run ID"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: pdfium-runtime-publish-feature
  cancel-in-progress: false

jobs:
  publish-runtime:
    if: github.ref == 'refs/heads/feature/kagzi-pdfium-native-text'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/kagzi-pdfium-native-text
          fetch-depth: 0

      - name: Download verified PDFium artifact
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id || inputs.runtime_run_id }}
          name: kagzi-pdfium-native-runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/kagzi-pdfium-artifact

      - name: Verify artifact and publish assets
        shell: bash
        run: |
          set -euo pipefail
          ARTIFACT_DIR=/tmp/kagzi-pdfium-artifact/kagzi-pdfium-native-runtime
          test -s "$ARTIFACT_DIR/kagzi-pdfium-native.js"
          test -s "$ARTIFACT_DIR/kagzi-pdfium-native.wasm"
          cd "$ARTIFACT_DIR"
          sha256sum --check SHA256SUMS.txt
          grep -F 'runtime=embedpdf/runtime@42388d3b4c9895d6672f5da357b1429678a0994c' BUILD-METADATA.txt
          grep -F 'emscripten=3.1.72' BUILD-METADATA.txt
          cd "$GITHUB_WORKSPACE"
          mkdir -p assets
          install -m 0644 $ARTIFACT_DIR/kagzi-pdfium-native.js assets/kagzi-pdfium-native.js
          install -m 0644 /tmp/kagzi-pdfium-artifact/kagzi-pdfium-native-runtime/kagzi-pdfium-native.wasm assets/kagzi-pdfium-native.wasm
          install -m 0644 /tmp/kagzi-pdfium-artifact/kagzi-pdfium-native-runtime/BUILD-METADATA.txt assets/kagzi-pdfium-native.BUILD-METADATA.txt
          install -m 0644 /tmp/kagzi-pdfium-artifact/kagzi-pdfium-native-runtime/kagzi-pdfium-LICENSE.txt assets/kagzi-pdfium-LICENSE.txt
          install -m 0644 /tmp/kagzi-pdfium-artifact/kagzi-pdfium-native-runtime/kagzi-pdfium-NOTICE.txt assets/kagzi-pdfium-NOTICE.txt
          install -m 0644 /tmp/kagzi-pdfium-artifact/kagzi-pdfium-native-runtime/kagzi-pdfium-THIRD-PARTY-NOTICES.txt assets/kagzi-pdfium-THIRD-PARTY-NOTICES.txt
          git add assets/kagzi-pdfium-native.js assets/kagzi-pdfium-native.wasm assets/kagzi-pdfium-native.BUILD-METADATA.txt assets/kagzi-pdfium-LICENSE.txt assets/kagzi-pdfium-NOTICE.txt assets/kagzi-pdfium-THIRD-PARTY-NOTICES.txt
          if git diff --cached --quiet; then
            echo "Verified PDFium runtime assets are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add verified PDFium browser runtime assets"
          git push origin HEAD:feature/kagzi-pdfium-native-text
