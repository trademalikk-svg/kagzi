name: KAGZI document workspace checks
on:
  push:
    branches: [feature/document-workspace]
  pull_request:
    branches: [main]
jobs:
  document-workspace-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check auth-guard.js
      - run: node --check script.js
      - run: node --check gov-documents.js
      - run: node --test tests/dashboard-audit.mjs tests/studio-ui-audit.mjs tests/education-library-audit.mjs tests/education-reader-audit.mjs tests/gov-directory-audit.mjs tests/office-tools-audit.mjs tests/document-library-audit.mjs
