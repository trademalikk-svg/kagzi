name: KAGZI studio checks
on:
  push:
    branches: [feature/kagzi-photo-pdf-studio, feature/kagzi-government-documents, feature/kagzi-government-documents-100, feature/kagzi-ebook-learning-hub]
  pull_request:
    branches: [fix/kagzi-dashboard-repair, feature/kagzi-photo-pdf-studio, feature/kagzi-government-documents, main]
jobs:
  studio-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check script.js
      - run: node --check education-data.mjs
      - run: node --test tests/education-library-audit.mjs tests/education-reader-audit.mjs
      - run: node --test tests/dashboard-audit.mjs
      - run: node --test tests/studio-ui-audit.mjs
      - run: node --test tests/gov-directory-audit.mjs
