name: Office Tools audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'office.html'
      - 'office.css'
      - 'office.js'
      - 'modules.js'
      - 'functions/api/assistant.js'
      - 'tests/office-tools-audit.mjs'
      - '.github/workflows/office-tools-audit.yml'
  push:
    branches: [feature/kagzi-office-tools]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/office-tools-audit.mjs
