<!doctype html>
<html lang="hi"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAGZI Article</title><meta name="description" content="KAGZI article">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://kagzi-8cy.pages.dev/article.html">
<meta property="og:type" content="article"><meta property="og:site_name" content="KAGZI"><meta property="og:title" content="KAGZI Article"><meta property="og:description" content="KAGZI article">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:17px/1.85 system-ui,"Noto Sans Devanagari",sans-serif}
header{background:#101a35;color:#fff;padding:18px max(18px,calc((100% - 820px)/2))}header a{color:#f1d98e;text-decoration:none}
main{max-width:820px;margin:28px auto;padding:0 18px}.paper{background:#fff;border:1px solid #e4e9f2;border-radius:16px;padding:clamp(20px,5vw,44px)}
h1{font-size:clamp(27px,5vw,40px);line-height:1.25;margin:8px 0 14px}.meta{font-size:13px;color:#68738a}.excerpt{font-size:19px;color:#536078;border-left:3px solid #d8b45a;padding-left:15px;margin:22px 0}
.body h2{font-size:25px;margin:30px 0 10px}.body h3{font-size:21px;margin:24px 0 8px}.body p{margin:0 0 16px}.body ul{padding-left:24px}.sources{border-top:1px solid #e4e9f2;margin-top:30px;padding-top:18px;font-size:14px}.sources a{overflow-wrap:anywhere;color:#315efb}
</style><script defer src="/config.js"></script><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head><body><header><strong>KAGZI</strong>　<a href="/articles/">All articles</a></header>
<main><article class="paper"><div id="tag" class="meta">KAGZI · ARTICLE</div><h1 id="title">Article लोड हो रहा है…</h1><div id="meta" class="meta"></div><p id="excerpt" class="excerpt"></p><div id="body" class="body"></div><section class="sources" id="sources"></section></article></main>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.118.0";
const cfg=window.KAGZI_CONFIG||{};const supabase=createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function markdown(value){let out="",list=false;for(const raw of String(value||"").split(/\r?\n/)){const line=raw.trim();if(!line){if(list){out+="</ul>";list=false;}continue;}const h=line.match(/^(#{1,3})\s+(.+)$/);if(h){if(list){out+="</ul>";list=false;}const n=h[1].length;out+="<h"+n+">"+esc(h[2])+"</h"+n+">";continue;}if(/^[-*]\s+/.test(line)){if(!list){out+="<ul>";list=true;}out+="<li>"+esc(line.replace(/^[-*]\s+/,""))+"</li>";continue;}if(list){out+="</ul>";list=false;}out+="<p>"+esc(line).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")+"</p>";}if(list)out+="</ul>";return out;}
const slug=new URLSearchParams(location.search).get("slug");
if(!slug){document.getElementById("title").textContent="Article नहीं मिला";}else{
 const {data,error}=await supabase.from("kagzi_articles").select("title,slug,excerpt,content_markdown,language,region,category,published_at,seo_title,meta_description,source_urls").eq("slug",slug).eq("status","published").maybeSingle();
 if(error||!data){document.getElementById("title").textContent="यह article उपलब्ध नहीं है।";document.getElementById("body").textContent="केवल प्रकाशित लेख ही सार्वजनिक रूप से उपलब्ध होते हैं।";}
 else{
  const title=data.seo_title||data.title;document.title=title+" | KAGZI";
  document.querySelector('meta[name="description"]').content=data.meta_description||data.excerpt||"KAGZI article";
  document.querySelector('link[rel="canonical"]').href=location.origin+"/article.html?slug="+encodeURIComponent(data.slug);
  document.querySelector('meta[property="og:title"]').content=title;
  document.querySelector('meta[property="og:description"]').content=data.meta_description||data.excerpt||"KAGZI article";
  document.documentElement.lang=data.language==="hi"?"hi":"en";
  document.getElementById("title").textContent=data.title;
  document.getElementById("tag").textContent=[data.language.toUpperCase(),data.region==="india"?"INDIA":"WORLDWIDE",data.category].join(" · ");
  document.getElementById("meta").textContent=data.published_at?new Date(data.published_at).toLocaleDateString("en-IN"):"";
  document.getElementById("excerpt").textContent=data.excerpt||"";
  document.getElementById("body").innerHTML=markdown(data.content_markdown);
  const sources=document.getElementById("sources");if((data.source_urls||[]).length){const h=document.createElement("h3");h.textContent="Sources";sources.append(h);for(const url of data.source_urls){if(!/^https:\/\//i.test(url))continue;const a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=url;sources.append(a,document.createElement("br"));}}
 }
}
</script></body></html>
